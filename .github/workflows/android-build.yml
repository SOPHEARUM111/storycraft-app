
name: Build StoryCraft APK

on:
  workflow_dispatch:
  push:
    paths:
      - "storycraft-firebase-ready.zip"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Extract project ZIP
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir -p extracted
          unzip -q storycraft-firebase-ready.zip -d extracted

      - name: Find Gradle project
        id: project
        shell: bash
        run: |
          PROJECT_FILE=$(find extracted -type f -name settings.gradle.kts | head -n 1)
          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: |
          gradle -p "${{ steps.project.outputs.dir }}" assembleDebug --no-daemon

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: storycraft-debug-apk
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
