name: Build StoryCraft APK

on:
workflow_dispatch:
push:
paths:
- 'storycraft-firebase-ready.zip'
- '.github/workflows/android-build.yml'

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:  
  - name: Checkout repository  
    uses: actions/checkout@v4  

  - name: Set up Java  
    uses: actions/setup-java@v4  
    with:  
      distribution: temurin  
      java-version: '17'  

  - name: Extract project ZIP  
    run: |  
      sudo apt-get update  
      sudo apt-get install -y unzip  
      mkdir extracted  
      unzip -q storycraft-firebase-ready.zip -d extracted  

  - name: Find Gradle project  
    id: project  
    run: |  
      WRAPPER=$(find extracted -type f -name gradlew | head -n 1)  
      if [ -z "$WRAPPER" ]; then  
        echo "ERROR: gradlew not found in ZIP"  
        exit 1  
      fi  
      echo "dir=$(dirname "$WRAPPER")" >> "$GITHUB_OUTPUT"  

  - name: Build debug APK  
    working-directory: extracted  
    run: |  
      chmod +x "${{ steps.project.outputs.dir }}/gradlew"  
      cd "${{ steps.project.outputs.dir }}"  
      ./gradlew assembleDebug --no-daemon  

  - name: Upload APK  
    if: success()  
    uses: actions/upload-artifact@v4  
    with:  
      name: storycraft-debug-apk  
      path: extracted/**/app/build/outputs/apk/debug/*.apk  
      if-no-files-found: error
